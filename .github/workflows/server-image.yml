# Prova il server e pubblica l'immagine Docker su ghcr.io.
#   - push su main     -> tag "edge" (versione di prova)
#   - push su sviluppo -> tag "sviluppo" (per provare una Pull Request prima del merge:
#                         SUITE_TAG=sviluppo nel .env del server di prova)
#   - tag v1.2.3       -> tag "1.2.3", "1.2" e "latest" (versione per gli installatori)
name: Immagine server

on:
  push:
    branches: [main, sviluppo]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/assist-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: assist-server
      # La prova completa usa anche l'agente, che sta nel repository ha-addons
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ha-addons
          path: ha-addons
          # sul branch sviluppo prova insieme l'agente dello stesso branch
          ref: ${{ (github.head_ref || github.ref_name) == 'sviluppo' && 'sviluppo' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r assist-server/requirements.txt requests
      - run: SERVER_DIR=assist-server AGENT_DIR=ha-addons/installer_agent assist-server/tests/run_e2e.sh
      - run: SERVER_DIR=assist-server AGENT_DIR=ha-addons/installer_agent assist-server/tests/run_security.sh

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=sviluppo,enable=${{ github.ref == 'refs/heads/sviluppo' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}${{ github.ref == 'refs/heads/sviluppo' && format('-{0}', steps.sha.outputs.short) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
